<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Quizzes</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        h1 { color: #333; }
        ul { list-style: none; padding: 0; }
        li { margin-bottom: 10px; }
        a.button {
            display: inline-block;
            padding: 8px 12px;
            background-color: #007BFF;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            margin-right: 5px;
        }
        a.button:hover { background-color: #0056b3; }
    </style>
</head>
<body>
    <h1>Quizzes</h1>
    <a href="{% url 'quizzes:quiz_create' %}" class="button">Create New Quiz</a>
    <ul>
        {% for quiz in quizzes %}
            <li>
                {{ quiz.title }}
                <a href="{% url 'quizzes:quiz_update' quiz.pk %}" class="button">Edit</a>
                <a href="{% url 'quizzes:quiz_delete' quiz.pk %}" class="button">Delete</a>
                <a href="{% url 'quizzes:quiz_take' quiz.pk %}" class="button">Take Quiz</a>
            </li>
        {% empty %}
            <li>No quizzes available.</li>
        {% endfor %}
    </ul>
</body>
</html>
