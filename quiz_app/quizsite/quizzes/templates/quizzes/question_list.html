{% extends 'quizzes/base.html' %}
{% block content %}
<h1>Questions</h1>
<a href="{% url 'question_create' %}">Create Question</a>
<ul>
{% for q in questions %}
<li>{{ q.text }}
<a href="{% url 'question_update' q.id %}">Edit</a>
<a href="{% url 'question_delete' q.id %}">Delete</a>
</li>
{% endfor %}
</ul>
{% endblock %}
