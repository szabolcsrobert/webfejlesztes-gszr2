<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Questions</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        h1 { color: #333; }
        ul { list-style: none; padding: 0; }
        li { margin-bottom: 10px; }
        a.button {
            display: inline-block;
            padding: 8px 12px;
            background-color: #007BFF;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            margin-right: 5px;
        }
        a.button:hover { background-color: #0056b3; }
    </style>
</head>
<body>
    <h1>Questions</h1>
    <a href="{% url 'quizzes:question_create' %}" class="button">Create New Question</a>
    <ul>
        {% for question in questions %}
            <li>
                {{ question.text }}
                <a href="{% url 'quizzes:question_update' question.pk %}" class="button">Edit</a>
                <a href="{% url 'quizzes:question_delete' question.pk %}" class="button">Delete</a>
            </li>
        {% empty %}
            <li>No questions available.</li>
        {% endfor %}
    </ul>
    <a href="{% url 'quizzes:quiz_list' %}" class="button">Back to Quiz List</a>
</body>
</html>
